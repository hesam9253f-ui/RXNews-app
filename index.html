<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RX News | پنل هوشمند</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            animation: fadeInUp 0.8s ease;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .card:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .card .title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .card .price {
            font-size: 0.9rem;
            color: #34d399; /* رنگ سبز برای قیمت */
            font-weight: 700;
        }

        .card.loading .price {
            color: var(--text-muted);
            animation: pulse 1.5s infinite;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>RX News</h1>
        <p>پنل هوشمند قیمت‌ها و خدمات</p>
    </div>

    <div class="grid-container">
        <!-- کارت دلار -->
        <div class="card loading" id="usd-card" onclick="tg.HapticFeedback.impactOccurred('light')">
            <div class="icon">💵</div>
            <div class="title">دلار آزاد</div>
            <div class="price" id="usd-price">در حال دریافت...</div>
        </div>

        <!-- کارت طلا -->
        <div class="card loading" id="gold-card" onclick="tg.HapticFeedback.impactOccurred('light')">
            <div class="icon">🥇</div>
            <div class="title">طلای ۱۸ عیار</div>
            <div class="price" id="gold-price">در حال دریافت...</div>
        </div>

        <!-- کارت سکه -->
        <div class="card loading" id="coin-card" onclick="tg.HapticFeedback.impactOccurred('light')">
            <div class="icon">🪙</div>
            <div class="title">سکه امامی</div>
            <div class="price" id="coin-price">در حال دریافت...</div>
        </div>

        <!-- کارت بیت‌کوین -->
        <div class="card loading" id="btc-card" onclick="tg.HapticFeedback.impactOccurred('light')">
            <div class="icon">₿</div>
            <div class="title">بیت‌کوین</div>
            <div class="price" id="btc-price">در حال دریافت...</div>
        </div>
    </div>

    <script>
        // اتصال به تلگرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // تمام صفحه شدن
        tg.ready();

        // آدرسی که قیمت‌ها رو ازش می‌خونیم
        const API_URL = "https://raw.githubusercontent.com/iran-market/iran-market.github.io/main/data/popular.json";

        async function fetchPrices() {
            try {
                // گرفتن قیمت‌های داخلی
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // پیدا کردن قیمت‌های مورد نظر
                const prices = data.data;
                
                const usd = prices.find(p => p.symbol === "USD_IRR_FREE");
                const gold = prices.find(p => p.symbol === "GOLD_18K_IRR");
                const coin = prices.find(p => p.symbol === "COIN_EMAMI_IRR");

                if (usd) {
                    document.getElementById("usd-price").innerText = usd.price.toLocaleString('fa-IR') + " تومان";
                    document.getElementById("usd-card").classList.remove("loading");
                }
                if (gold) {
                    document.getElementById("gold-price").innerText = gold.price.toLocaleString('fa-IR') + " تومان";
                    document.getElementById("gold-card").classList.remove("loading");
                }
                if (coin) {
                    document.getElementById("coin-price").innerText = coin.price.toLocaleString('fa-IR') + " تومان";
                    document.getElementById("coin-card").classList.remove("loading");
                }

                // گرفتن قیمت بیت‌کوین از CoinGecko
                const btcRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
                const btcData = await btcRes.json();
                if (btcData.bitcoin) {
                    document.getElementById("btc-price").innerText = "$" + btcData.bitcoin.usd.toLocaleString('en-US');
                    document.getElementById("btc-card").classList.remove("loading");
                }

            } catch (error) {
                console.error("خطا در دریافت قیمت:", error);
                document.querySelectorAll('.price').forEach(el => {
                    el.innerText = "خطا در دریافت";
                });
            }
        }

        // اجرای تابع هنگام باز شدن صفحه
        fetchPrices();
    </script>
</body>
</html>
