<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RX News | Ultra</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Vazirmatn', sans-serif; }
        
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.15), transparent 40%);
            color: var(--text);
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* --- هدر --- */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .user-profile {
            display: flex; align-items: center; gap: 10px;
            background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 50px; padding: 4px 12px 4px 4px;
            cursor: pointer; transition: 0.3s;
        }
        .user-profile:active { transform: scale(0.95); box-shadow: 0 0 15px var(--primary-glow); }
        .avatar-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .avatar-fallback { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 1.2rem; }
        .user-name { font-size: 0.9rem; font-weight: 700; }
        
        .brand { font-size: 1.6rem; font-weight: 900; background: linear-gradient(90deg, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }

        /* --- کارت‌های قیمت --- */
        .prices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .price-card {
            background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px;
            position: relative; overflow: hidden; box-shadow: 0 15px 35px -10px rgba(0,0,0,0.8);
            transition: 0.3s;
        }
        .price-card:active { transform: translateY(-2px); }
        .price-card::before { content: ''; position: absolute; top: 0; right: 0; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03)); }
        .price-title { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .price-value { font-size: 1.3rem; font-weight: 900; color: var(--success); direction: ltr; text-align: right; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .price-value.loading { color: var(--muted); animation: pulse 1.5s infinite; font-size: 1rem; text-shadow: none; }

        /* --- بخش‌بندی --- */
        .section-header { font-size: 1.1rem; font-weight: 900; margin: 25px 0 15px 0; display: flex; align-items: center; gap: 8px; }
        .section-header::before { content: ''; display: block; width: 5px; height: 20px; background: linear-gradient(to bottom, var(--primary), var(--secondary)); border-radius: 5px; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .menu-btn {
            background: var(--card); border: 1px solid var(--glass-border); border-radius: 18px;
            padding: 18px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px;
            color: white; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.2s;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .menu-btn:active { background: var(--primary); transform: scale(0.95); box-shadow: 0 0 20px var(--primary-glow); }
        .menu-btn .icon { font-size: 1.8rem; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }

        /* --- پنل‌های داخلی --- */
        .sub-view { display: none; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; padding: 14px; border-radius: 14px; width: 100%; margin-bottom: 20px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; backdrop-filter: blur(10px); transition: 0.2s; }
        .back-btn:active { background: var(--danger); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* --- اخبار --- */
        .news-item { background: var(--card); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 15px; border-right: 4px solid var(--primary); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5); }
        .news-item h3 { font-size: 1.05rem; font-weight: 900; margin-bottom: 12px; line-height: 1.6; color: #e2e8f0; }
        .news-item p { font-size: 0.9rem; color: var(--muted); line-height: 1.8; margin-bottom: 15px; text-align: justify; }
        .news-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--secondary); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; font-weight: 700; }

        /* --- فرم‌ها و ورودی‌ها --- */
        .form-box { background: var(--card); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; backdrop-filter: blur(10px); }
        input[type="text"] {
            width: 100%; padding: 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4); color: white; font-size: 1rem; margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .action-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-size: 1.05rem; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px -5px var(--primary-glow); }
        .action-btn:active { transform: scale(0.97); }

        /* --- ماشین حساب --- */
        .calc-screen { background: rgba(0,0,0,0.6); border-radius: 16px; padding: 20px; text-align: left; font-size: 2.5rem; font-weight: 900; color: var(--success); margin-bottom: 20px; direction: ltr; overflow-x: auto; border: 1px solid var(--glass-border); }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 14px; padding: 20px; font-size: 1.3rem; font-weight: 900; color: white; cursor: pointer; transition: 0.1s; }
        .calc-btn:active { background: var(--primary); transform: scale(0.9); }
        .calc-btn.op { color: var(--secondary); }
        .calc-btn.equal { background: var(--primary); grid-column: span 2; }

        /* --- کامنت‌ها --- */
        .comment-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .comment-box input { margin-bottom: 0; }
        .comment-item { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 15px; margin-bottom: 10px; border-right: 3px solid var(--secondary); }
        .comment-name { font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
        .comment-text { font-size: 0.9rem; line-height: 1.6; }
        .comment-text.censored { color: #fca5a5; font-family: monospace; font-size: 1rem; letter-spacing: 2px; }

        /* --- پروفایل --- */
        .profile-card { text-align: center; padding: 30px 20px; }
        .profile-avatar-lg { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px auto; object-fit: cover; border: 3px solid var(--primary); box-shadow: 0 0 30px var(--primary-glow); }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="user-profile" onclick="showView('profile-view')">
            <img id="header-avatar-img" class="avatar-img" src="" style="display:none;">
            <div id="header-avatar-fallback" class="avatar-fallback">?</div>
            <div class="user-name" id="header-name">کاربر</div>
        </div>
        <div class="brand">RX Ultra</div>
    </div>

    <div id="main-view">
        <!-- قیمت‌ها -->
        <div class="prices-grid">
            <div class="price-card"><div class="price-title"><span>دلار آمریکا</span>💵</div><div class="price-value loading" id="usd-price">...</div></div>
            <div class="price-card"><div class="price-title"><span>طلای ۱۸ عیار</span>🥇</div><div class="price-value loading" id="gold-price">...</div></div>
            <div class="price-card"><div class="price-title"><span>سکه امامی</span>🪙</div><div class="price-value loading" id="coin-price">...</div></div>
            <div class="price-card"><div class="price-title"><span>بیت‌کوین</span>₿</div><div class="price-value loading" id="btc-price">...</div></div>
        </div>

        <!-- اخبار -->
        <div class="section-header">دنیای اخبار</div>
        <div class="menu-grid">
            <button class="menu-btn" onclick="loadNews('general', 'اخبار عمومی')"><span class="icon">📰</span>عمومی</button>
            <button class="menu-btn" onclick="loadNews('sport', 'اخبار ورزشی')"><span class="icon">⚽</span>ورزشی</button>
            <button class="menu-btn" onclick="loadNews('politics', 'اخبار سیاسی')"><span class="icon">🏛️</span>سیاسی</button>
            <button class="menu-btn" onclick="loadNews('economy', 'اخبار اقتصادی')"><span class="icon">💰</span>اقتصادی</button>
            <button class="menu-btn" onclick="loadNews('tech', 'اخبار فناوری')"><span class="icon">💻</span>فناوری</button>
            <button class="menu-btn" onclick="loadNews('photo', 'اخبار تصویری')"><span class="icon">📸</span>تصویری</button>
        </div>

        <!-- ابزارها -->
        <div class="section-header">جعبه ابزار</div>
        <div class="menu-grid" style="grid-template-columns: 1fr 1fr;">
            <button class="menu-btn" onclick="showView('calc-view')"><span class="icon">🔢</span>ماشین‌حساب</button>
            <button class="menu-btn" onclick="showView('trans-view')"><span class="icon">🌐</span>مترجم</button>
        </div>

        <!-- کامنت‌ها -->
        <div class="section-header">نظرات کاربران</div>
        <div class="form-box">
            <div class="comment-box">
                <input type="text" id="comment-input" placeholder="نظر خود را بنویسید..." style="margin-bottom:0;">
                <button class="action-btn" style="width: 80px; padding: 0;" onclick="addComment()">ارسال</button>
            </div>
            <div id="comments-list" style="margin-top: 15px;"></div>
        </div>

        <!-- لینک‌ها -->
        <div class="section-header">ارتباط با ما</div>
        <div style="display:flex; gap:10px;">
            <a href="https://t.me/RXNwes_ir_bot" class="action-btn" style="text-decoration:none; text-align:center; background: rgba(56, 150, 229, 0.2); border: 1px solid #3896e5; box-shadow: none;">تلگرام</a>
            <a href="https://rubika.ir/RXNwes_ir_bot" class="action-btn" style="text-decoration:none; text-align:center; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; box-shadow: none;">روبیکا</a>
        </div>
    </div>

    <!-- اخبار -->
    <div id="news-view" class="sub-view">
        <button class="back-btn" onclick="goBack()">🔙 بازگشت</button>
        <div class="section-header" id="news-title">...</div>
        <div id="news-list"></div>
    </div>

    <!-- ماشین حساب -->
    <div id="calc-view" class="sub-view">
        <button class="back-btn" onclick="goBack()">🔙 بازگشت</button>
        <div class="form-box">
            <div class="calc-screen" id="calc-screen">0</div>
            <div class="calc-grid">
                <button class="calc-btn op" onclick="calcInput('C')">C</button>
                <button class="calc-btn op" onclick="calcInput('/')">÷</button>
                <button class="calc-btn op" onclick="calcInput('*')">×</button>
                <button class="calc-btn op" onclick="calcInput('-')">-</button>
                
                <button class="calc-btn" onclick="calcInput('7')">7</button>
                <button class="calc-btn" onclick="calcInput('8')">8</button>
                <button class="calc-btn" onclick="calcInput('9')">9</button>
                <button class="calc-btn op" onclick="calcInput('+')">+</button>
                
                <button class="calc-btn" onclick="calcInput('4')">4</button>
                <button class="calc-btn" onclick="calcInput('5')">5</button>
                <button class="calc-btn" onclick="calcInput('6')">6</button>
                <button class="calc-btn equal" style="grid-row: span 2;" onclick="calcInput('=')">=</button>
                
                <button class="calc-btn" onclick="calcInput('1')">1</button>
                <button class="calc-btn" onclick="calcInput('2')">2</button>
                <button class="calc-btn" onclick="calcInput('3')">3</button>
                
                <button class="calc-btn" style="grid-column: span 3;" onclick="calcInput('0')">0</button>
            </div>
        </div>
    </div>

    <!-- مترجم -->
    <div id="trans-view" class="sub-view">
        <button class="back-btn" onclick="goBack()">🔙 بازگشت</button>
        <div class="form-box">
            <input type="text" id="trans-input" placeholder="متن فارسی یا انگلیسی...">
            <button class="action-btn" onclick="doTranslate()">ترجمه کن</button>
            <div id="trans-result" style="margin-top: 15px; padding: 15px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); border-radius: 14px; color: var(--success); display: none; text-align: center;"></div>
        </div>
    </div>

    <!-- پروفایل -->
    <div id="profile-view" class="sub-view">
        <button class="back-btn" onclick="goBack()">🔙 بازگشت</button>
        <div class="form-box profile-card">
            <img id="profile-avatar-img" class="profile-avatar-lg" src="" style="display:none;">
            <div id="profile-avatar-fallback" class="avatar-fallback" style="width:100px; height:100px; font-size:3rem; margin: 0 auto 20px auto;"></div>
            
            <h2 style="margin-bottom: 5px;" id="profile-display-name">کاربر</h2>
            <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 25px; direction: ltr;">ID: <span id="profile-id">...</span></p>
            
            <input type="text" id="edit-name" placeholder="نام نمایشی جدید...">
            <button class="action-btn" onclick="saveProfile()">ذخیره تغییرات</button>
            <p style="margin-top: 15px; font-size: 0.75rem; color: var(--muted);">* اطلاعات تلگرام شما محفوظ است.</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // --- مدیریت پروفایل و عکس ---
        const tgUser = tg.initDataUnsafe?.user || { id: "نامشخص", first_name: "کاربر", photo_url: null };
        let userProfile = {
            id: tgUser.id,
            firstName: tgUser.first_name,
            photoUrl: tgUser.photo_url,
            displayName: localStorage.getItem('rx_ultra_name') || tgUser.first_name
        };

        function initProfile() {
            // هدر
            document.getElementById('header-name').innerText = userProfile.displayName;
            const hImg = document.getElementById('header-avatar-img');
            const hFall = document.getElementById('header-avatar-fallback');
            
            if(userProfile.photoUrl) {
                hImg.src = userProfile.photoUrl;
                hImg.style.display = 'block';
                hFall.style.display = 'none';
            } else {
                hFall.innerText = userProfile.displayName.charAt(0).toUpperCase();
            }

            // صفحه پروفایل
            document.getElementById('profile-display-name').innerText = userProfile.displayName;
            document.getElementById('profile-id').innerText = userProfile.id;
            document.getElementById('edit-name').value = userProfile.displayName;

            const pImg = document.getElementById('profile-avatar-img');
            const pFall = document.getElementById('profile-avatar-fallback');
            if(userProfile.photoUrl) {
                pImg.src = userProfile.photoUrl;
                pImg.style.display = 'block';
                pFall.style.display = 'none';
            } else {
                pFall.innerText = userProfile.displayName.charAt(0).toUpperCase();
            }
        }
        initProfile();

        function saveProfile() {
            const newName = document.getElementById('edit-name').value.trim();
            if(newName) {
                userProfile.displayName = newName;
                localStorage.setItem('rx_ultra_name', newName);
                initProfile();
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert("پروفایل بروزرسانی شد.");
            }
        }

        // --- قیمت‌ها ---
        async function getPrices() {
            try {
                const res = await fetch("https://raw.githubusercontent.com/iran-market/iran-market.github.io/main/data/popular.json");
                const data = await res.json();
                const p = data.data;
                
                const updatePrice = (id, price) => {
                    const el = document.getElementById(id);
                    if(el) { el.innerText = price.toLocaleString('fa-IR'); el.classList.remove("loading"); }
                };

                const usd = p.find(x => x.symbol === "USD_IRR_FREE");
                const gold = p.find(x => x.symbol === "GOLD_18K_IRR");
                const coin = p.find(x => x.symbol === "COIN_EMAMI_IRR");
                
                if(usd) updatePrice("usd-price", usd.price);
                if(gold) updatePrice("gold-price", gold.price);
                if(coin) updatePrice("coin-price", coin.price);

                const btcRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
                const btcData = await btcRes.json();
                if(btcData.bitcoin) updatePrice("btc-price", btcData.bitcoin.usd);
            } catch(e) { console.error("Price error", e); }
        }
        getPrices();

        // --- اخبار (تفکیک منابع) ---
        const feeds = {
            'general': 'https://feeds.bbci.co.uk/persian/rss.xml',
            'politics': 'https://feeds.bbci.co.uk/persian/rss.xml',
            'sport': 'https://www.iranintl.com/feed',
            'economy': 'https://www.iranintl.com/feed',
            'tech': 'https://www.iranintl.com/feed',
            'photo': 'https://www.iranintl.com/feed'
        };

        async function loadNews(category, title) {
            tg.HapticFeedback.impactOccurred('medium');
            showView('news-view');
            document.getElementById('news-title').innerText = title;
            document.getElementById('news-list').innerHTML = '<div style="text-align:center; color:var(--primary); margin-top:20px;">⏳ در حال دریافت...</div>';

            try {
                const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feeds[category])}`;
                const res = await fetch(url);
                const data = await res.json();

                if(data.status === 'ok' && data.items.length > 0) {
                    let items = data.items;
                    
                    // فیلتر برای دسته‌های ایران اینترنشنال (چون فید عمومی است)
                    if(['sport', 'economy', 'tech', 'photo'].includes(category)) {
                        const keywords = {
                            'sport': ["ورزش", "فوتبال", "لیگ", "تیم", "قهرمانی", "بازی"],
                            'economy': ["اقتصاد", "دلار", "تورم", "بازار", "سکه", "طلا", "بانک"],
                            'tech': ["فناوری", "تکنولوژی", "اینترنت", "هوش مصنوعی", "موبایل", "کامپیوتر"],
                            'photo': ["عکس", "تصویر", "گالری"]
                        };
                        items = items.filter(item => keywords[category].some(kw => item.title.includes(kw) || item.description.includes(kw)));
                    }

                    if(items.length === 0) {
                        document.getElementById('news-list').innerHTML = '<div style="text-align:center; color:var(--danger); margin-top:20px;">❌ خبری در این دسته یافت نشد.</div>';
                        return;
                    }

                    let html = '';
                    items.slice(0, 5).forEach(item => {
                        let date = item.pubDate ? new Date(item.pubDate).toLocaleDateString('fa-IR') : 'نامشخص';
                        // متن کامل خبر (بدون تگ)
                        let fullDesc = item.description.replace(/<[^>]*>?/gm, '');
                        html += `
                            <div class="news-item">
                                <h3>${item.title}</h3>
                                <p>${fullDesc}</p>
                                <div class="news-meta">
                                    <span>🕐 ${date}</span>
                                    <span style="color: var(--primary);" onclick="tg.openLink('${item.link}')">مشاهده کامل ↗</span>
                                </div>
                            </div>`;
                    });
                    document.getElementById('news-list').innerHTML = html;
                } else {
                    document.getElementById('news-list').innerHTML = '<div style="text-align:center; color:var(--danger); margin-top:20px;">❌ خطا در دریافت.</div>';
                }
            } catch(e) {
                document.getElementById('news-list').innerHTML = '<div style="text-align:center; color:var(--danger); margin-top:20px;">❌ خطای شبکه.</div>';
            }
        }

        // --- ماشین حساب ---
        let calcStr = "0";
        function calcInput(val) {
            tg.HapticFeedback.impactOccurred('light');
            if(val === 'C') { calcStr = "0"; }
            else if(val === '=') {
                try { calcStr = eval(calcStr).toString(); } catch { calcStr = "Error"; }
            }
            else {
                if(calcStr === "0" || calcStr === "Error") calcStr = val;
                else calcStr += val;
            }
            document.getElementById('calc-screen').innerText = calcStr;
        }

        // --- مترجم ---
        async function doTranslate() {
            const text = document.getElementById('trans-input').value;
            const resBox = document.getElementById('trans-result');
            if(!text) return;
            resBox.style.display = 'block'; resBox.innerText = "⏳ در حال ترجمه...";
            const isFa = /[\u0600-\u06FF]/.test(text);
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${isFa ? 'fa|en' : 'en|fa'}`);
                const data = await res.json();
                resBox.innerText = data.responseData.translatedText;
            } catch(e) { resBox.innerText = "❌ خطا در ترجمه."; }
        }

        // --- کامنت‌ها و سانسور ---
        let comments = JSON.parse(localStorage.getItem('rx_comments') || '[]');

        function renderComments() {
            const list = document.getElementById('comments-list');
            if(comments.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--muted); font-size:0.8rem;">هنوز نظری ثبت نشده است.</div>';
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="comment-name">${c.name}</div>
                    <div class="comment-text ${c.isCensored ? 'censored' : ''}">${c.text}</div>
                </div>
            `).join('');
        }
        renderComments();

        function addComment() {
            const input = document.getElementById('comment-input');
            let text = input.value.trim();
            if(!text) return;

            // فیلتر کلمات رکیک
            const badWords = ["پاتریک", "احمق", "خنگ", "کص", "کیر", "گاییدم", "لعنتی", "بیشعور", "مادرخراب"];
            let isCensored = false;
            
            badWords.forEach(word => {
                // ساخت الگوی تشخیص با فاصله و نقطه
                let pattern = word.split('').join('[\\s\\.]*');
                let regex = new RegExp(pattern, 'gi');
                if(regex.test(text)) {
                    text = text.replace(regex, '***');
                    isCensored = true;
                }
            });

            comments.unshift({ name: userProfile.displayName, text: text, isCensored: isCensored });
            localStorage.setItem('rx_comments', JSON.stringify(comments));
            input.value = '';
            renderComments();
            tg.HapticFeedback.notificationOccurred('success');
        }

        // --- ناوبری ---
        function showView(viewId) {
            tg.HapticFeedback.impactOccurred('light');
            document.getElementById('main-view').style.display = 'none';
            document.querySelectorAll('.sub-view').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'block';
            window.scrollTo(0, 0);
        }

        function goBack() {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.sub-view').forEach(el => el.style.display = 'none');
            document.getElementById('main-view').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
